
name: Kemaskini Trend Harga

on:
  schedule:
    - cron: '0 2 1 * *'   # setiap 1hb bulan, 2 pagi UTC (~10 pagi MYT)
  workflow_dispatch:        # boleh jalankan manual dari tab Actions

jobs:
  kemaskini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow
      - run: python etl.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trend.json
          git diff --quiet --cached || git commit -m "Kemaskini automatik trend harga"
          git push
